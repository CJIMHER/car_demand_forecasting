# Concesionario propio y competencia cercana, tal como aparecen en los scrapers de Volkswagen.
#
# La marca es_propio de stock_externo_snapshot se decide SOLO por dealer_id (el campo dealer.key
# de la web de stock, p. ej. ESP00710). Los nombres son informativos: la web puede escribirlos
# de varias formas y no se usan para marcar filas.
#
# Si se cambia este fichero, las filas ya cargadas se vuelven a marcar con:
#   make remarcar-propio

# Una instancia, un concesionario: todo lo propio del concesionario sale de aquí (o del .env), nunca
# del código ni de las plantillas del panel.
propio:
  nombre: AVISA
  # Cabecera del panel
  nombre_panel: Volkswagen Sevilla
  marca: Volkswagen
  ciudad: Sevilla
  # Código INE de la provincia del concesionario: zona por defecto del panel («Nuestro peso en
  # <provincia>»). La comunidad autónoma sale de la provincia.
  provincia_codigo: "41"
  dealer_ids:
    - ESP00710
  # Nombres con que aparece en los scrapers (dealer_name). Comprobar con  make concesionarios
  nombres_en_scrapers:
    - AVISA

# Competencia directa en Sevilla. No cambia ninguna columna todavía; se deja aquí para el panel
# y las alertas de los hitos siguientes.
competencia:
  - dealer_id: ESP00713
    nombre: Sevilla Wagen
  - dealer_id: ESP00714
    nombre: Utrewal

# Umbrales del panel
panel:
  # Con menos anuncios que esto, el precio mediano y los días publicado se muestran atenuados con su n
  n_minimo_medianas: 5
  # «Frente a hace 7 días» muestra la diferencia en anuncios; el porcentaje, atenuado, solo si hace
  # 7 días había al menos estos anuncios
  n_minimo_porcentaje: 10
  # Dirección: antigüedad media del stock propio frente a este objetivo (días)
  objetivo_antiguedad_dias: 60

# Modelos de la marca, de más a menos habituales. Hoy solo los usan los datos de ejemplo del panel
# (make ejemplo-cargar); el catálogo de versiones llega con Walcu.
modelos:
  VN: [T-Roc, T-Cross, Tiguan, Golf, Polo, Taigo, ID.4, ID.3, Tayron, Passat]
  VO: [Golf, Polo, T-Roc, Tiguan, T-Cross, Taigo, Passat, Touran]
