# Cómo leer la exportación de leads de Walcu (scripts/walcu_agregar.py, en el Mac).
#
# Los valores se comparan sin mayúsculas, sin tildes y con los espacios reducidos a uno. Los estados, los
# motivos y los tipos son texto que configura cada concesionario en Walcu: COMPROBAR con una exportación
# real. El script escribe al final cuántos leads ha leído con cada valor de Estado y de Tipo, y los motivos
# de fracaso que se repiten, para ajustar esto.

# Columnas de la exportación que se leen (todas las demás se ignoran sin leerlas)
columnas:
  origen: Origen
  campana: Detalle campaña
  tipo: Tipo de vehículo solicitado
  fecha: Fecha Lead
  negociacion: Id negociación creada     # con valor: el lead tiene negociación creada = cita…
  resultado_actividad: Resultado última actividad   # … salvo las de actividades_no_cita
  estado: Estado
  motivo_fracaso: Motivo fracaso
  codigo_postal: Código postal            # solo para la zona; nunca se escribe
  # Solo para el tipo (sedes_vo, equipos_vo) y las empresas excluidas (config/concesionario.yaml,
  # propio.empresas_excluidas): nunca se escriben
  sede: Sede
  equipo: Equipo
  # Solo se lee si hay comerciales excluidos (fichero local, fuera del repositorio): nunca se escribe
  comercial: Vendedor

# Un lead con negociación creada NO cuenta como cita si su «Resultado última actividad» es uno de estos
actividades_no_cita: ["PRESUPUESTO POR TELÉFONO"]

# Venta = negociación cerrada como vendida: lead que cuenta como cita y cuyo Estado CONTIENE alguno de estos
# textos. Valores reales: «Negociación creada (Cerrada / Vendido)» y «En curso (Cerrada / Vendido)»
estados_venta: [Vendido]

# Número inexistente: el motivo de fracaso contiene alguno de estos textos (valor real: «Número inexistente»)
motivos_num_inexistente: [Número inexistente]

# Tipo (VN o VO) de cada lead, por este orden:
#   1. El nombre de la campaña, con las reglas de ámbito de config/campanas.yaml: [VN] o [VO]; si no, VN o VO
#      al principio del nombre; si no, una de palabras_vo (palabra entera) → VO.
#   2. Si el nombre no lo dice: sede o equipo del lead en sedes_vo o equipos_vo → VO.
#   3. El campo «Tipo de vehículo solicitado» (tipos). Walcu marca «Nuevo» casi todos los leads de campañas
#      de ocasión (2.443 de 2.484 en Facebook): por eso va detrás.
#   4. tipo_por_defecto.
palabras_vo: [ocasión, boutique, seminuevo, seminuevos]
sedes_vo: [Carpa VO]
equipos_vo: [VO]

# Tipo de vehículo solicitado → VN o VO (valores reales: «Nuevo», «VO», «Km0» y vacío). Vacío → tipo_por_defecto;
# un valor que no esté aquí también, y se cuenta en el registro
tipos:
  VN: [Nuevo]
  VO: [VO, Km0]
tipo_por_defecto: VN

# Orígenes que se conservan con su nombre (alias → nombre). La web propia sale de config/concesionario.yaml
# (propio.web). Los demás van a «otros».
origenes:
  Facebook: [facebook, instagram, "facebook lead ads", meta]
  AiVORA: [aivora]
  Carwow: [carwow]
  Coches.net: [coches.net, cochesnet]
  Google Ads: [google ads, google, adwords]

# ---------------------------------------------------------------------------- negociaciones (ventas por fecha)
# scripts/walcu_agregar.py --negociaciones: exportación de NEGOCIACIONES de Walcu → CSV de ventas por semana de la
# venta (semana, tipo, modelo, ventas) para  make walcu-ventas-cargar  (regla de caída de ventas de la campaña
# general). Solo se leen estas columnas; sede, equipo y vendedor solo sirven para excluir y nunca se escriben
# (si la exportación no las trae, no se excluye por ellas y se avisa).
negociaciones:
  columnas:
    estado: Estado
    fecha_cierre: Fecha de cierre
    tipo: Tipo negociación
    modelo: Modelo
    sede: Sede
    equipo: Equipo
    comercial: Vendedor           # solo si hay comerciales excluidos (fichero local)
  opcionales: [sede, equipo, comercial]
  # Venta: el Estado CONTIENE alguno de estos (valor real: «Cerrada / Vendido»)
  estados_venta: [Cerrada / Vendido]
  # Tipo negociación → VN o VO (Km0 es VO); otro valor: la negociación no cuenta y se avisa
  tipos:
    VN: [Nuevo]
    VO: [VO, Km0]
  # Sedes y equipos de otras marcas o empresas del grupo que no cuentan (contiene, sin mayúsculas ni tildes),
  # además de propio.empresas_excluidas de config/concesionario.yaml
  sedes_excluidas: []
  equipos_excluidos: []

