# Cómo leer la exportación de leads de Walcu (scripts/walcu_agregar.py, en el Mac).
#
# Los valores se comparan sin mayúsculas, sin tildes y con los espacios reducidos a uno. Los estados, los
# motivos y los tipos son texto que configura cada concesionario en Walcu: COMPROBAR con una exportación
# real. El script escribe al final cuántos leads ha leído con cada valor de Estado y de Tipo, y los motivos
# de fracaso que se repiten, para ajustar esto.

# Columnas de la exportación que se leen (todas las demás se ignoran sin leerlas)
columnas:
  origen: Origen
  campana: Detalle campaña
  tipo: Tipo de vehículo solicitado
  fecha: Fecha Lead
  negociacion: Id negociación creada     # con valor: el lead tiene negociación creada = cita…
  resultado_actividad: Resultado última actividad   # … salvo las de actividades_no_cita
  estado: Estado
  motivo_fracaso: Motivo fracaso
  codigo_postal: Código postal            # solo para la zona; nunca se escribe
  # Solo se lee si hay comerciales excluidos (fichero local, fuera del repositorio): nunca se escribe
  comercial: Vendedor

# Un lead con negociación creada NO cuenta como cita si su «Resultado última actividad» es uno de estos
actividades_no_cita: ["PRESUPUESTO POR TELÉFONO"]

# Venta = negociación cerrada como vendida: lead que cuenta como cita y cuyo Estado CONTIENE alguno de estos
# textos. Valores reales: «Negociación creada (Cerrada / Vendido)» y «En curso (Cerrada / Vendido)»
estados_venta: [Vendido]

# Número inexistente: el motivo de fracaso contiene alguno de estos textos (valor real: «Número inexistente»)
motivos_num_inexistente: [Número inexistente]

# Tipo de vehículo solicitado → VN o VO (valores reales: «Nuevo», «VO», «Km0» y vacío). Vacío → tipo_por_defecto;
# un valor que no esté aquí también, y se cuenta en el registro
tipos:
  VN: [Nuevo]
  VO: [VO, Km0]
tipo_por_defecto: VN

# Orígenes que se conservan con su nombre (alias → nombre). La web propia sale de config/concesionario.yaml
# (propio.web). Los demás van a «otros».
origenes:
  Facebook: [facebook, instagram, "facebook lead ads", meta]
  AiVORA: [aivora]
  Carwow: [carwow]
  Coches.net: [coches.net, cochesnet]
  Google Ads: [google ads, google, adwords]
