# Campañas: a qué modelo y a qué stock va cada una, y cómo se unen Meta, GA4 y los leads de Walcu.
# Lo usa ingesta/campanas.py. Tras cambiarlo: make campanas (o esperar a la descarga siguiente de
# Meta o GA4). Así se reclasifican las campañas de Marketing y las de «Estado de las fuentes» →
# «Campañas sin regla».
#
# 1. Regla de unión (Meta ↔ GA4 ↔ Walcu)
#    La clave es el utm_campaign de los enlaces de los anuncios:
#      - Walcu lo guarda en cada lead (origin.campaign) y los leads se agregan por campaña;
#      - GA4 lo da como sessionCampaignName;
#      - en Meta, el utm_campaign de cada anuncio debe ser el NOMBRE DE LA CAMPAÑA ({{campaign.name}}
#        en los parámetros de URL del anuncio).
#    Las tres se comparan normalizadas: minúsculas, sin tildes, y todo lo que no sea letra o número
#    convertido en «_» («T-Roc Ocasión · Noviembre» → «t_roc_ocasion_noviembre»).
#    Si una campaña usa otro utm_campaign, se añade aquí en «equivalencias» (utm_campaign → nombre de
#    la campaña en Meta, los dos tal como aparecen).
#    Una campaña de GA4 que se une a una de Meta se clasifica como la de Meta.
#
# 2. Reglas por nombre (tipo, ámbito y modelo de cada campaña)
#    El nombre se lee sin distinguir mayúsculas ni tildes y sin importar los espacios
#    («VW [VN][2026] Taigo noviembre» = «vw [vn] [2026]  TAIGO Noviembre»):
#      a. Ámbito, por la etiqueta: [VN] → nuevos (VN); [VO] → ocasión (VO). Con [VN] y [VO] a la vez,
#         no hay regla. Sin etiqueta, por las palabras (enteras): «ocasión», «ocasion» o «VO» → VO;
#         «nuevos» o «VN» → VN («nuevo» no cuenta: «Nuevo T-Roc» es un modelo); con ninguna, o con
#         palabras de los dos, ambos. «Boutique Ocasión» y «Liquidacion VO» son generales de VO.
#      b. Tipo general si el nombre contiene alguna palabra de «generales» (también pegada a otra:
#         «BlackFriday»). Una general mantiene su ámbito: «VW [VO][2026] Black Friday» es general de
#         ocasión.
#      c. Si no es general, es de un modelo: lo que va después del año (2026 o [2026]) hasta el mes
#         (enero … diciembre). Lo que siga al mes («Noviembre 2») se ignora. El modelo se normaliza con
#         el catálogo de config/versiones.yaml («t roc», «TROC» → T-Roc).
#      d. Un modelo que no está en ese catálogo (los turismos que capturamos), como Caravelle, se
#         asigna igual, tal como está escrito, pero «sin datos de mercado»: la regla e y la
#         comparación con la competencia dicen que no se pueden aplicar en lugar de decidir.
#    Una campaña que no casa sale en «Estado de las fuentes» → «Campañas sin regla», con el motivo.
#
# 3. Asignaciones a mano (opcional). Tienen prioridad sobre las reglas. «campana»: el nombre en Meta,
#    tal como aparece (se compara normalizado); tipo: modelo o general; ambito: VN, VO o ambos;
#    modelo: solo en las de tipo modelo (se normaliza igual que en las reglas).
#    Ejemplos:
#      - {campana: "Liquidacion VO", tipo: general, ambito: VO}
#      - {campana: "Promo Golf GTI", tipo: modelo, ambito: VN, modelo: Golf}

meta:
  # Versión de la Marketing API (Graph API). Meta retira cada versión unos dos años después de
  # publicarla: comprobar la vigente en developers.facebook.com/docs/graph-api/changelog.
  version_api: v24.0

equivalencias: {}

reglas:
  # Palabras que hacen general una campaña (sin distinguir mayúsculas ni tildes)
  generales: [days, friday, liquidación, liquidacion, boutique]

asignaciones: []
