# Páginas de la web en GA4: qué rutas cuentan, de qué marca son, de qué tipo y de qué modelo. Lo usan
# make ga4-explorar (ingesta/ga4_explorar.py) y las señales semanales de intención (ingesta/ga4_series.py:
# make ga4-series y la descarga diaria de GA4). La propiedad de GA4 es de todo el grupo.
#
# Cada página es un dominio (hostName de GA4) y una ruta (pagePath o landingPage, sin parámetros), comparados en
# minúsculas y sin tildes. Orden:
#   1. dominios: la web tiene un subdominio por marca. Solo cuentan los de la marca propia (todo lo suyo es de la
#      marca propia); los otros subdominios del grupo son de otras marcas y los dominios ajenos al grupo, fuera.
#      En los dominios compartidos por varias marcas, o sin dominio en GA4 («(not set)»), la marca sale de las
#      palabras de la ruta (respaldo, punto 3).
#   2. excluir: rutas que no son de la web comercial (peticiones, sedes, legal, posventa…). No cuentan.
#   3. marca por la ruta (solo de respaldo): otra marca del grupo, fuera; la propia y la que no dice marca, sí
#      (por separado).
#   4. tipos: el primero que casa da el tipo de página, su tipo de stock (VN, VO o ninguno) y, en las
#      fichas, el modelo.
# make ga4-explorar enseña todos los dominios de los últimos 12 meses, con sus vistas y cómo se tratan.
#
# Tras cambiarlo: make ga4-explorar EJEMPLOS=1 para comprobar las rutas de cada tipo y, si cambia lo que
# ya se cargó, make ga4-series DESDE=2023-06-05 (cada semana recargada sustituye a la anterior).

dominios:
  # Subdominios de la marca propia: el de turismos y, si existe, el de vehículos comerciales (comprobar con
  # make ga4-explorar, sección «Dominios», y añadirlo aquí)
  propios: [volkswagen.avisa.es]
  # Dominios del grupo: sus otros subdominios (audi.avisa.es…) son de otras marcas y no cuentan
  # cartujamotor.com e hispalauto.com: empresas del grupo con otras marcas
  grupo: [avisa.es, cartujamotor.com, hispalauto.com]
  # Dominios del grupo compartidos por todas las marcas: la marca sale de la ruta
  compartidos: [avisa.es, www.avisa.es]

excluir:
  - '^/peticion(/|$)'                 # peticiones y causas solidarias: no son de la web comercial
  - '^/concesionarios(/|$)'           # fichas de las sedes del grupo
  - '^/(equipo|avisa|empresa|quienes-somos|trabaja-con-nosotros|empleo|blog|noticias)(/|$)'
  - '^/(privacy|privacidad|aviso-legal|politica|cookies|condiciones|legal)'
  - '^/(opiniones|testimonios|servicios(-[0-9]+)?)(/|$)'
  - '(testimonio|accesibilidad|^/about(/|$)|^/sobre-nosotros(/|$))'
  - '(estado-de-mi-vehiculo|vehicle-status)'
  - 'accesorios'
  - '(taller|post-?venta|recambios|mantenimiento|chapa|pintura|neumaticos|itv|cita-taller)'

# Marcas, por palabras enteras de la ruta («/landing-volkswagen-taigo» → landing, volkswagen, taigo). Un modelo
# de varias palabras («t-roc», «id-buzz») tiene que aparecer seguido. Precedencia: el nombre de otra marca →
# otra marca; si no, la marca propia o uno de sus modelos → propia; si no, un modelo de otra marca → otra marca;
# si no, sin marca (inicio, ofertas, listados de todas las marcas…). Los modelos propios sirven además para el
# modelo de las fichas y listados.
marcas:
  propia: [volkswagen, vw]           # incluidos sus vehículos comerciales
  # Modelos de la marca propia: nombre (como se guarda) → formas en la ruta
  modelos_propios:
    T-Roc: [t-roc, troc]
    T-Cross: [t-cross, tcross]
    Taigo: [taigo]
    Polo: [polo]
    Golf: [golf]
    Tiguan: [tiguan]
    Tayron: [tayron]
    Passat: [passat]
    Arteon: [arteon]
    Touareg: [touareg]
    Touran: [touran]
    Sharan: [sharan]
    Scirocco: [scirocco]
    Jetta: [jetta]
    Beetle: [beetle]
    ID.3: [id-3, id3]
    ID.4: [id-4, id4]
    ID.5: [id-5, id5]
    ID.7: [id-7, id7]
    ID. Buzz: [id-buzz, idbuzz]
    Caddy: [caddy]
    Transporter: [transporter, e-transporter]
    Multivan: [multivan]
    Caravelle: [caravelle]
    California: [california, grand-california]
    Crafter: [crafter, e-crafter]
    Amarok: [amarok]
  otras: [audi, skoda, seat, cupra]
  modelos_otras: [a1, a3, a4, a5, a6, a7, a8, q2, q3, q4, q5, q6, q7, q8, e-tron, etron, tt, kamiq, karoq,
                  kodiaq, fabia, octavia, scala, superb, enyaq, elroq, arona, ibiza, leon, ateca, tarraco,
                  formentor, born, tavascan, terramar, mii, citigo, myaudiandme, fulldrive]
  # Sedes de otras marcas o empresas del grupo (palabras seguidas en la ruta): fuera, como otra marca
  sedes_otras: [cartuja-motor, hispalauto]

# Tipos de página. patron: expresión regular sobre la ruta. tipo: VN, VO o nada. ficha: true → cuenta como ficha
# (vistas de fichas) y se saca el modelo de la ruta (modelos_propios); modelo: true → se saca el modelo sin ser ficha
# (listados por modelo).
# Ficha frente a listado, en ocasión, km 0 y nuevos: es ficha solo si la ruta termina en un identificador numérico
# (5 cifras o más al final, tras «/» o «-»: «…/caddy/diesel/2-0-tdi…/2020/1000444937»; un año, «…/2021», no
# lo es); si no, es listado por modelo, con su modelo («/coches/segunda-mano/todas-ciudades/volkswagen/caddy» → listado, Caddy).
tipos:
  - nombre: Inicio
    patron: '^/(es/?)?$'
  - nombre: Gracias (formulario enviado)
    patron: '(gracias|thank-?you|confirmacion)'
  - nombre: Ficha de km 0
    patron: '/(vehiculos-km-?0[^/]*|km-?0)/(.+[/-])?[0-9]{5,}$'
    tipo: VO
    ficha: true
  - nombre: Listado de km 0
    patron: '/vehiculos-km-?0|/km-?0(/|$)'
    tipo: VO
    modelo: true
  # Stock de ocasión: /coches/segunda-mano[+km0]/<ciudad>/<marca>/<modelo>/…/<id>, /vehiculos-de-ocasion-en-stock,
  # /ocasion-hibridos-y-electricos-volkswagen…
  - nombre: Ficha de ocasión
    patron: '/(coches/segunda-mano(\+km-?0)?|ocasion[^/]*|vehiculos-(de-)?ocasion[^/]*|coches-(de-)?ocasion|seminuevos?|segunda-mano|usados?)/(.+[/-])?[0-9]{5,}$'
    tipo: VO
    ficha: true
  - nombre: Listado de ocasión
    patron: '/(coches/segunda-mano(\+km-?0)?|ocasion[^/]*|vehiculos-(de-)?ocasion[^/]*|coches-(de-)?ocasion|seminuevos?|segunda-mano|usados?)(/|$)'
    tipo: VO
    modelo: true
  - nombre: Configurador
    patron: 'configurador'
    tipo: VN
    modelo: true
  - nombre: Landing de modelo
    patron: '^/landing-'
    tipo: VN
    ficha: true
  # Nuevos: /coches/nuevos/<marca>/<modelo>/<carrocería>/<año>[/…/<id>], /vehiculos-comerciales/<marca>/<modelo>/…
  - nombre: Ficha de nuevo
    patron: '/(coches/nuevos|coches-nuevos|vehiculos-nuevos[^/]*|nuevos?|gama|modelos?|vehiculos-comerciales)/(.+[/-])?[0-9]{5,}$'
    tipo: VN
    ficha: true
  - nombre: Listado de nuevos
    patron: '/(coches/nuevos|coches-nuevos|vehiculos-nuevos[^/]*|nuevos?|gama|modelos?|vehiculos-comerciales)(/|$)'
    tipo: VN
    modelo: true
  - nombre: Buscador
    patron: '^/coches(/|$)'
  - nombre: Comparador
    patron: 'compar'
  - nombre: Ofertas
    patron: '(ofertas?|promociones?|promos?)(/|-|$)'
  - nombre: Financiación y renting
    patron: '(financiacion|renting|leasing)'
  - nombre: Tasación
    patron: '(tasacion|tasamos|tasar|vende-tu-coche|compramos)'
  - nombre: Prueba de conducción
    patron: '(prueba|test-?drive|longdrive)'
  - nombre: Contacto
    patron: '(contact|habla-con|get-in-touch|solicitar|llamar|presupuesto)'
