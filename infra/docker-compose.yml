# Plataforma cdf: Postgres y jobs. Se usa siempre a través del Makefile de la raíz, que hace:
#   docker compose -p cdf --env-file /opt/cdf/.env -f infra/docker-compose.yml ...
# Prefijo cdf_ en contenedores, red y volúmenes. Postgres NO publica ningún puerto.

name: cdf

services:
  postgres:
    image: postgres:16
    # Sin «ports»: solo se llega desde la red interna cdf_net (contenedor jobs). No añadir puertos;
    # como mucho "127.0.0.1:5432:5432" para una consulta puntual desde el propio servidor.
    container_name: cdf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en /opt/cdf/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en /opt/cdf/.env}
      POSTGRES_DB: ${POSTGRES_DB:-cdf}
      TZ: Europe/Madrid
      PGTZ: Europe/Madrid
    volumes:
      - cdf_pgdata:/var/lib/postgresql/data
    networks: [cdf_net]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  jobs:
    build:
      context: ..
      dockerfile: infra/jobs/Dockerfile
      args:
        # UID/GID del usuario cdf del servidor, dueño de /opt/cdf/data/* (el Makefile usa  id -u cdf).
        CDF_UID: ${CDF_UID:?falta CDF_UID (id -u cdf)}
        CDF_GID: ${CDF_GID:?falta CDF_GID (id -g cdf)}
    image: cdf_jobs:latest
    container_name: cdf_jobs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # El .env del servidor es la única fuente de secretos: de ahí salen BUCKET, BACKUP_PASSPHRASE,
    # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID y el remoto de rclone (RCLONE_CONFIG_HZ_*), sin fichero
    # rclone.conf. Las tareas de cron solo reciben la lista de infra/jobs/exportar_entorno.sh.
    env_file:
      - ${CDF_ENV_FILE:-/opt/cdf/.env}
    environment:
      TZ: Europe/Madrid
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-cdf}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-hz}
      CDF_SCRAPERS_DATA: /datos/scrapers
    volumes:
      # Bases de los scrapers. Se abren SIEMPRE con mode=ro; la carpeta se monta con escritura
      # solo porque SQLite necesita crear su fichero -shm para leer una base en modo WAL.
      - /opt/cdf/data/vo:/datos/scrapers/vo
      - /opt/cdf/data/vn:/datos/scrapers/vn
      - /opt/cdf/data/vn_otros:/datos/scrapers/vn_otros
      - /opt/cdf/logs/jobs:/logs
    networks: [cdf_net]

  # Hito 1b. Definidos para reservar nombre; no arrancan hasta que se quite el perfil.
  panel:
    image: busybox:1.36
    container_name: cdf_panel
    profiles: ["hito1b"]
    command: ["true"]
    networks: [cdf_net]

  caddy:
    image: caddy:2
    container_name: cdf_caddy
    profiles: ["hito1b"]
    networks: [cdf_net]
    volumes:
      - cdf_caddy_data:/data

networks:
  cdf_net:
    name: cdf_net

volumes:
  cdf_pgdata:
    name: cdf_pgdata
  cdf_caddy_data:
    name: cdf_caddy_data
