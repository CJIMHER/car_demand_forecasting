# Plataforma cdf: Postgres y jobs. Se usa siempre a través del Makefile de la raíz, que hace:
#   docker compose -p cdf --env-file /opt/cdf/.env -f infra/docker-compose.yml ...
# Prefijo cdf_ en contenedores, red y volúmenes. Postgres NO publica ningún puerto; solo Caddy
# publica el 80 y el 443 (perfil «panel», solo si PANEL_DOMINIO tiene valor).

name: cdf

services:
  postgres:
    image: postgres:16
    # Sin «ports»: solo se llega desde la red interna cdf_net (contenedor jobs). No añadir puertos;
    # como mucho "127.0.0.1:5432:5432" para una consulta puntual desde el propio servidor.
    container_name: cdf_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?falta POSTGRES_USER en /opt/cdf/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en /opt/cdf/.env}
      POSTGRES_DB: ${POSTGRES_DB:-cdf}
      TZ: Europe/Madrid
      PGTZ: Europe/Madrid
    volumes:
      - cdf_pgdata:/var/lib/postgresql/data
    networks: [cdf_net]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12

  jobs:
    build:
      context: ..
      dockerfile: infra/jobs/Dockerfile
      args:
        # UID/GID del usuario cdf del servidor, dueño de /opt/cdf/data/* (el Makefile usa  id -u cdf).
        CDF_UID: ${CDF_UID:?falta CDF_UID (id -u cdf)}
        CDF_GID: ${CDF_GID:?falta CDF_GID (id -g cdf)}
    image: cdf_jobs:latest
    container_name: cdf_jobs
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # El .env del servidor es la única fuente de secretos: de ahí salen BUCKET, BACKUP_PASSPHRASE,
    # TELEGRAM_BOT_TOKEN, los TELEGRAM_CHAT_* de cada rol, el token de Meta, la propiedad de GA4 y el
    # remoto de rclone (RCLONE_CONFIG_HZ_*), sin fichero rclone.conf. Las tareas de cron solo reciben la lista de infra/jobs/exportar_entorno.sh.
    env_file:
      - ${CDF_ENV_FILE:-/opt/cdf/.env}
    environment:
      TZ: Europe/Madrid
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-cdf}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-hz}
      CDF_SCRAPERS_DATA: /datos/scrapers
      CDF_GTRENDS_ENTRADA: /entrada/gtrends
    volumes:
      # Bases de los scrapers. Se abren SIEMPRE con mode=ro; la carpeta se monta con escritura
      # solo porque SQLite necesita crear su fichero -shm para leer una base en modo WAL.
      - /opt/cdf/data/vo:/datos/scrapers/vo
      - /opt/cdf/data/vn:/datos/scrapers/vn
      - /opt/cdf/data/vn_otros:/datos/scrapers/vn_otros
      # Exportación del componente de fichas (color de cada anuncio): solo lectura y solo la carpeta
      # de exportaciones (la caché colors.sqlite3 de su carpeta padre no se monta).
      - /opt/cdf/data/vw_details/exports:/datos/scrapers/vw_details/exports:ro
      - /opt/cdf/logs/jobs:/logs
      # Credenciales en fichero (cuenta de servicio de GA4), fuera del repositorio y solo lectura:
      # /opt/cdf/secretos (700, de cdf), cada fichero 600. GA4_CREDENCIALES=/secretos/<fichero>.json
      - /opt/cdf/secretos:/secretos:ro
      # Entregas de Google Trends subidas desde el Mac (make gtrends-subir): solo lectura
      - /opt/cdf/entrada/gtrends:/entrada/gtrends:ro
    networks: [cdf_net]

  # Panel (hito 1b). Perfil «panel»: solo los arranca «make deploy» si PANEL_DOMINIO tiene valor.
  # Sin env_file: el panel recibe solo lo que necesita (ni Telegram, ni el bucket, ni la frase de
  # las copias). Se conecta a Postgres como cdf_panel, que no puede leer las tablas de hechos.
  panel:
    build:
      context: ..
      dockerfile: panel/Dockerfile
    image: cdf_panel:latest
    container_name: cdf_panel
    profiles: ["panel"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Madrid
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cdf}
      PGUSER: cdf_panel
      PGPASSWORD: ${PANEL_DB_PASSWORD:-}
      PANEL_SESION_DIAS: ${PANEL_SESION_DIAS:-30}
      # Roles que ven las vistas con datos de ejemplo (docs/contrato_panel.md)
      PANEL_EJEMPLO_VISIBLE_PARA: ${PANEL_EJEMPLO_VISIBLE_PARA:-tecnico}
      PANEL_PROXY: caddy
    # Sin privilegios: usuario panel (UID 10001) de la imagen, sistema de ficheros de solo lectura
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Sin «ports»: solo Caddy llega a él, por la red cdf_web
    networks: [cdf_net, cdf_web]

  caddy:
    image: caddy:2.8.4
    container_name: cdf_caddy
    profiles: ["panel"]
    restart: unless-stopped
    depends_on:
      panel:
        condition: service_healthy
    environment:
      PANEL_DOMINIO: ${PANEL_DOMINIO:-}
    # El único servicio que publica puertos: 80 (redirección y reto ACME) y 443 (HTTPS, también HTTP/3)
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - cdf_caddy_data:/data
      - cdf_caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    networks: [cdf_web]

networks:
  cdf_net:
    name: cdf_net
  # Caddy y el panel; Postgres no está en esta red
  cdf_web:
    name: cdf_web

volumes:
  cdf_pgdata:
    name: cdf_pgdata
  cdf_caddy_data:
    name: cdf_caddy_data
  cdf_caddy_config:
    name: cdf_caddy_config
