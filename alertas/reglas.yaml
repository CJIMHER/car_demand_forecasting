# Reglas del motor de alertas (alertas/motor.py, cron de cdf_jobs a las 09:15). Deterministas: sin
# ningún modelo de lenguaje. Aquí van los umbrales, los destinatarios y los textos; el código
# (alertas/reglas.py) solo sabe hacer la comparación que nombra «calculo».
#
# Campos de cada regla:
#   id          identificador estable (va en la tabla alertas y en la clave de deduplicación)
#   nombre      cómo se llama en el panel
#   calculo     función de alertas/reglas.py que la evalúa
#   roles       destinatarios: direccion, ventas, marketing, tecnico. Una alerta calculada sobre
#               filas de ejemplo va SOLO a tecnico, con «[EJEMPLO]» delante (lo exige también la base)
#   fuente      tablas de las que depende. Las del contrato del panel (panel_*, docs/contrato_panel.md)
#               deciden si la regla está activa: con filas reales en todas, se evalúa con ellas; si
#               no, con filas de ejemplo en todas, se evalúa sobre el ejemplo (solo para tecnico); si
#               no, queda inactiva. fuentes_estado y panel_mercado_* son siempre reales.
#   tema, nivel lo que muestra el panel (tema: ventas, stock, campanas, mercado, datos; nivel: aviso, info)
#   umbrales    números de la regla
#   n_minimo    clave de config/concesionario.yaml (sección panel) con el n mínimo: por debajo, la
#               regla no salta
#   texto       el motivo en una frase, con huecos {así} para las cifras (formato español)
#
# Los umbrales son una propuesta inicial (docs/diseno.md, Señales y alertas): se calibran en el piloto.
version: reglas-2026-11-24

reglas:
  # ------------------------------------------------------------------ con datos reales desde ya
  - id: fuente_caida
    nombre: Fuente caída
    calculo: fuente_caida
    roles: [tecnico]
    fuente: [fuentes_estado]
    tema: datos
    nivel: aviso
    umbrales:
      # La copia corre a las 09:30, después de las alertas: se mira la última. Salta si falló o si
      # la última correcta tiene más días que estos.
      dias_sin_copia: 2
    textos:
      scraper_sin_captura: "Scraper {fuente}: sin captura completa del {dia}{detalle}."
      scraper_sin_cargar: "Scraper {fuente}: {anuncios} anuncios capturados el {dia} sin cargar en Postgres."
      scraper_error: "Scraper {fuente}: la comprobación del {dia} terminó con error ({error})."
      sin_comprobacion: "Sin comprobación de los scrapers del {dia}: la tarea de las 09:00 no ha anotado nada."
      carga_error: "Carga de {fuente} a Postgres del {dia} con error: {error}."
      precalculo_error: "El precálculo del panel del {dia} falló en «{paso}»: {error}."
      sin_precalculo: "Sin precálculo del panel del {dia}: la tarea de las 09:10 no ha anotado nada."
      copia_error: "La última copia de Postgres ({dia}) falló en «{paso}»."
      sin_copia: "Sin copia correcta de Postgres desde el {dia} ({dias} días)."
      descarga_error: "Descarga de {fuente} del {dia} con error: {error}."

  - id: gtrends_pendiente
    nombre: Google Trends sin descargar
    calculo: gtrends_pendiente
    roles: [tecnico]
    fuente: [gtrends_entrega]
    tema: datos
    nivel: aviso
    umbrales:
      dias_maximos: 35        # la descarga es manual y mensual (ingesta/gtrends.py)
    textos:
      sin_entrega: "Toca descargar Google Trends: todavía no hay ninguna entrega cargada (make gtrends-enlaces en el Mac)."
      caducada: "Toca descargar Google Trends: la última descarga es del {dia}, hace {dias} días (make gtrends-enlaces en el Mac)."

  - id: competidor_stock
    nombre: Presión de un competidor (stock)
    calculo: competidor_stock
    roles: [ventas, direccion]
    fuente: [panel_mercado_dia, panel_mercado_competidor]
    tema: mercado
    nivel: aviso
    umbrales:
      subida_unidades: 5      # y además…
      subida_pct: 25          # … al menos este % sobre los anuncios de hace 7 días
    n_minimo: n_minimo_porcentaje   # anuncios del concesionario en ese modelo hace 7 días
    texto: "{concesionario} sube su stock de {modelo} {tipo_texto} en {provincia}: de {antes} a {ahora} anuncios en 7 días (+{subida_pct} %)."

  - id: competidor_precio
    nombre: Presión de un competidor (precio)
    calculo: competidor_precio
    roles: [ventas, direccion]
    fuente: [panel_mercado_dia, panel_mercado_competidor]
    tema: mercado
    nivel: aviso
    umbrales:
      bajada_pct: 3           # caída del precio mediano del segmento (modelo + acabado) en 7 días
    n_minimo: n_minimo_medianas     # anuncios con precio del segmento, hoy y hace 7 días
    texto: "{concesionario} baja el precio mediano de {modelo} {acabado} {tipo_texto}: de {antes} a {ahora} en 7 días (−{bajada_pct} %, {n} anuncios con precio)."

  - id: perdida_peso
    nombre: Pérdida de peso
    calculo: perdida_peso
    roles: [ventas, direccion]
    fuente: [panel_mercado_dia, panel_mercado_modelo]
    tema: mercado
    nivel: aviso
    umbrales:
      caida_puntos: 5         # puntos de porcentaje de nuestro peso en el modelo
    n_minimo: n_minimo_porcentaje   # anuncios del modelo en la provincia, hoy y hace 7 días
    texto: "Nuestro peso en {modelo} {tipo_texto} en {provincia} cae {caida_puntos} puntos en 7 días: del {antes} % al {ahora} % ({propios} de {anuncios} anuncios)."

  # ------------------------------------------------------------------ preparadas: se activan con su fuente
  - id: vehiculo_envejecido
    nombre: Vehículo envejecido
    calculo: vehiculo_envejecido
    roles: [ventas]
    fuente: [panel_riesgo_vehiculo, panel_curva_grupo]
    tema: stock
    nivel: aviso
    umbrales:
      percentil_curva: 75     # días en stock por encima del percentil 75 de la curva de su grupo
    texto: "{vehiculo} ({stock_id}): {dias} días en stock, por encima del percentil {percentil} de su grupo ({limite} días; {n} coches)."

  - id: riesgo_inmovilizacion
    nombre: Riesgo de inmovilización
    calculo: riesgo_inmovilizacion
    roles: [ventas, direccion]
    fuente: [panel_riesgo_vehiculo]
    tema: stock
    nivel: aviso
    umbrales:
      prob_maxima: 0.5        # probabilidad (p50) de venderse en 90 días por debajo de esto
    texto: "{vehiculo} ({stock_id}): {prob} % de venderse en 90 días (entre {p10} y {p90} %), con {dias} días en stock."

  - id: ventas_fuera_banda
    nombre: Ventas fuera de la banda
    calculo: ventas_fuera_banda
    roles: [direccion]
    fuente: [panel_ventas_mes]
    tema: ventas
    nivel: aviso
    texto: "Ventas {tipo_texto} del mes {sentido} de lo previsto: {real} a día {dia_mes}, frente a {p10}–{p90}."

  - id: caida_leads
    nombre: Caída de leads
    calculo: caida_leads
    roles: [marketing]
    fuente: [panel_leads_dia]
    tema: campanas
    nivel: aviso
    umbrales:
      dias: 14                # los últimos 14 días frente a los 14 anteriores
      caida_pct: 30
      base_minima: 10         # leads en los 14 días anteriores
    texto: "Leads de {modelo} {tipo_texto}: {ahora} en los últimos {dias} días frente a {antes} en los {dias} anteriores (−{caida_pct} %)."

  # ------------------------------------------------------------------ campañas de Meta: criterios de Cayetano
  # (docs/criterios_marketing_meta.md). Umbrales, volúmenes y textos en «criterios_meta», más abajo;
  # son los mismos para las alertas, la decisión de cada campaña y la recomendación por modelo.
  # Todas se activan con solo panel_campana_dia real. Walcu, campaña a campaña: la carga diaria
  # (panel_leads_dia) si la hay; si no, la mensual (make walcu-cargar → panel_campana_mes) si hay carga
  # del mes y la campaña casa con sus leads. a, c (coste por cita), d y subir necesitan citas y ventas:
  # sin Walcu dicen «sin datos de Walcu» y no se aplican. b, c (coste por lead) y f usan los leads de
  # Walcu o, si no, los de Meta («leads según Meta»). La comparación con la referencia por días de vida
  # (panel_campana_salud) es solo detalle explicativo.
  - id: meta_a
    nombre: "Campaña: leads que no se convierten en citas (regla a)"
    calculo: criterio_meta
    criterio: a
    roles: [marketing]
    fuente: [panel_campana_dia]
    tema: campanas
    nivel: aviso
    texto: "Campaña «{titulo}» · {decision} (regla a): {cifras}. Revisar: {revisar}"

  - id: meta_b
    nombre: "Campaña: el anuncio no atrae o no convence (regla b)"
    calculo: criterio_meta
    criterio: b
    roles: [marketing]
    fuente: [panel_campana_dia]
    tema: campanas
    nivel: aviso
    texto: "Campaña «{titulo}» · {decision} (regla b): {cifras}. {revisar}"

  - id: meta_c
    nombre: "Campaña: lead caro (regla c)"
    calculo: criterio_meta
    criterio: c
    roles: [marketing]
    fuente: [panel_campana_dia]
    tema: campanas
    nivel: aviso
    texto: "Campaña «{titulo}» · {decision} (regla c): {cifras}. {revisar}"

  - id: meta_d
    nombre: "Campaña: leads y citas en precio, pocas ventas (regla d)"
    calculo: criterio_meta
    criterio: d
    roles: [marketing]
    fuente: [panel_campana_dia]
    tema: campanas
    nivel: aviso
    # 33 % es el óptimo, no un mínimo habitual: se avisa en el texto de que saltará a menudo
    texto: "Campaña «{titulo}» · {decision} (regla d): {cifras}. Revisar: {revisar} El 33 % es el óptimo: esta alerta saltará a menudo."

  - id: meta_f
    nombre: "Campaña: cansancio del anuncio (regla f)"
    calculo: criterio_meta
    criterio: f
    roles: [marketing]
    fuente: [panel_campana_dia]
    tema: campanas
    nivel: aviso
    texto: "Campaña «{titulo}» · {decision} (regla f): {cifras}. Revisar: {revisar}"

  - id: meta_subir
    nombre: "Campaña: subir presupuesto"
    calculo: criterio_meta
    criterio: subir
    roles: [marketing]
    fuente: [panel_campana_dia]
    tema: campanas
    nivel: info
    texto: "Campaña «{titulo}» · subir presupuesto: {cifras}."

  - id: ventana_favorable
    nombre: Ventana favorable para una campaña general
    calculo: ventana_favorable
    roles: [marketing]
    fuente: [panel_semana_campana]
    tema: campanas
    nivel: info
    umbrales:
      semanas: 2              # las dos semanas siguientes
    texto: "Semana del {semana} favorable para una campaña general ({tipo_texto}): {indice} veces una semana media ({p10}–{p90}). {motivos}"

# ------------------------------------------------------------------ criterios de las campañas de Meta
# Los de docs/criterios_marketing_meta.md, iguales para VN y VO. Importes en euros; tasas en %.
# Una campaña se juzga desde su segundo día de vida, con sus cifras desde que empezó. Una regla sin
# su dato no se aplica (p. ej., «fuera de zona» sin código postal en los leads).
criterios_meta:
  dias_vida_minimos: 1            # el segundo día de vida: día 0 = el primero
  # «En la media» (reglas c y d): el coste de la campaña no pasa de la referencia de c.referencia_anio
  # del mismo tipo (VN o VO; las de ambos, VN y VO juntos), de make referencias-meta. Sin referencia, la
  # media de todas las campañas de los últimos `media_dias` (sin ella misma) más esta tolerancia
  media_dias: 90
  media_tolerancia_pct: 20
  a:
    lead_cita_minima_pct: 5       # revisar si citas/leads < 5 %
    n_minimo_leads: 20            # con menos leads se muestra la tasa, pero no salta
    fuera_zona_maxima_pct: 35     # revisar si fuera de zona > 35 % (desde el segundo día; antes 30 %)
    n_minimo_leads_con_cp: 1      # leads con código postal: sin mínimo
    revisar: "la localización y las audiencias de la campaña; los motivos de descarte que anota el comercial."
    revisar_fuera_zona: "si dominan los de fuera de zona, que el copy, el reel y la foto nombren la provincia, y que el formulario pida como obligatorios el código postal y si quiere ver el coche en la provincia."
  b:
    # Tres señales; cualquiera de ellas la dispara.
    # Volumen mínimo de cada señal: por debajo, la cifra se muestra pero la señal no salta.
    n_minimo:
      impresiones: 1000           # señal 1 (tasa de clic)
      clics: 50                   # señal 2 (tasa de clic a lead)
    # 1) Tasa de clic = clics / impresiones de Meta. Por debajo: el anuncio no atrae.
    tasa_clic_minima_pct: 1
    revisar_no_atrae: "El anuncio no atrae: revisar la creatividad (reel, foto) y el mensaje."
    # 2) Tasa de clic a lead = leads / clics. Por debajo: atrae pero no convence.
    clic_lead_minima_pct: 3
    revisar_no_convence: "Atrae pero no convence: revisar la llamada a la acción, la oferta y el formulario."
    # 3) «Claramente por debajo» de campañas del mismo modelo y mismo mes del año (años anteriores):
    #    leads / impresiones por debajo de factor_historico × la de esas campañas.
    factor_historico: 0.5
    revisar_historico: "Por debajo de campañas del mismo modelo y mes: revisar la creatividad, el mensaje, la llamada a la acción y la oferta."
  c:
    coste_lead_maximo: 10         # si se pasa: continuar si el coste por cita está en la media; si no, parar
    # «Coste por cita en la media» = como mucho el de 2025 del mismo tipo (panel_referencia_meta)
    referencia_anio: 2025
    continuar: "El coste por cita está en la media: se continúa."
    parar: "Parar y revisar audiencias y creatividad."
    sin_media: "Sin media de coste por cita para decidir: revisar audiencias y creatividad."
    # Con leads según Meta (sin datos de Walcu) no hay citas: la decisión es revisar
    sin_coste_cita: "Sin datos de Walcu: falta el coste por cita para decidir entre continuar y parar."
  d:
    tasa_venta_minima_pct: 33     # el óptimo: revisar si ventas/citas < 33 % con coste por lead y por cita en la media
    n_minimo_citas: 6
    segmentos_mostrados: 3        # vehículos similares en la zona cercana que se citan
    revisar: "el motivo de descarte del comercial; los similares en la zona cercana{similares}; el desempeño del comercial."
  e:
    unidades_minimas: 3           # unidades propias del modelo publicadas en la zona cercana
    # Precio: el nuestro por debajo de la mediana de la competencia en la zona cercana, mismo modelo,
    # acabado y motor. Solo cuentan los segmentos con al menos este n de la competencia (clave de
    # config/concesionario.yaml) y el modelo cumple si están por debajo más de la mitad de nuestras
    # unidades con comparables.
    n_minimo_competencia: n_minimo_medianas
  f:
    dias_recientes: 3             # leads por día de los últimos 3 días…
    dias_anteriores: 7            # … frente a la media de los 7 anteriores
    caida_minima_pct: 30          # al menos un 30 % menos
    coste_lead_maximo: 10         # y coste por lead de esos 3 días por encima de 10 €
    revisar: "renovar la creatividad (reel, foto, copy) antes de seguir invirtiendo."
  subir:                          # todos a la vez, la regla e y ninguna regla de revisión activa
    coste_lead_maximo: 10
    coste_cita_maximo: 100
    lead_cita_minima_pct: 5
    tasa_venta_minima_pct: 33
    coste_venta_maximo: 400
