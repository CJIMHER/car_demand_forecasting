{% extends "base.html" %}
{% block titulo %}Cambiar la contraseña{% endblock %}
{% block contenido %}
<section class="tarjeta formulario">
  <h1>Cambiar la contraseña</h1>
  {% if obligatorio %}<p class="nota">Has entrado con una contraseña temporal. Elige una nueva para seguir.</p>{% endif %}
  <form method="post" action="/cambiar-clave" class="campos">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="actual">Contraseña actual</label>
    <input id="actual" name="actual" type="password" autocomplete="current-password" maxlength="256" required>
    <label for="nueva">Contraseña nueva (12 caracteres como mínimo)</label>
    <input id="nueva" name="nueva" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
    <label for="repetida">Repite la contraseña nueva</label>
    <input id="repetida" name="repetida" type="password" autocomplete="new-password" minlength="12" maxlength="256" required>
    {% if mensaje %}<p class="mensaje-error" role="alert">{{ mensaje }}</p>{% endif %}
    <button type="submit" class="boton">Guardar</button>
  </form>
</section>
{% endblock %}
